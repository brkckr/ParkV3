name: Instrumented tests

# Device tests (Room schema/migration, main flow) on emulators. Separate from the main CI
# because an emulator run takes several minutes. API 34 is the required check; API 37 runs
# the app on Android 17 with its targetSdk 37 behavior changes (docs/adr/0015).
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  connected:
    name: Emulator (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 34
            sdk-level: "34"
          # Since API 36.1 the SDK publishes platforms and system images under a minor
          # version: there is no "android-37", only "android-37.0" (and later 37.x).
          - api-level: 37
            sdk-level: "37.0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        run: ./gradlew --stacktrace assembleDebug assembleDebugAndroidTest
      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.sdk-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          # The default data partition is too small for the Android 17 image to install the
          # app ("Requested internal only, but not enough space").
          disk-size: 8G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # The action runs each line on its own.
          script: |
            bash .github/scripts/emulator-ready.sh
            ./gradlew --stacktrace connectedDebugAndroidTest
      - name: Print device test failures
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True)
          total = failed = 0
          for f in files:
              for case in ET.parse(f).getroot().iter("testcase"):
                  total += 1
                  for tag in ("failure", "error"):
                      for node in case.findall(tag):
                          failed += 1
                          print(f"FAILED {case.get('classname')}.{case.get('name')}\n{(node.text or node.get('message') or '')[:4000]}\n")
          print(f"device tests: {total} run, {failed} failed")
          # Gradle can end successfully when the APK never got installed; no tests is a failure.
          if total == 0:
              print("::error::No device tests ran")
          raise SystemExit(1 if total == 0 or failed else 0)
          PY
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports-api-${{ matrix.api-level }}
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
