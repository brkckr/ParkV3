name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-test:
    name: Unit tests (JVM + Robolectric)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Run unit tests
        run: ./gradlew --stacktrace testDebugUnitTest
      - name: Check that the exported Room schema is committed
        # Migration tests and future auto-migrations rely on app/schemas being versioned.
        # Compared as JSON so formatting-only differences do not fail the build.
        run: |
          problems="$(git ls-files --others --exclude-standard app/schemas)"
          for f in $(git diff --name-only -- app/schemas); do
            python3 -c 'import json,subprocess,sys; p=sys.argv[1]; a=json.loads(subprocess.check_output(["git","show","HEAD:"+p])); b=json.load(open(p)); sys.exit(a!=b)' "$f" || problems="$problems $f"
          done
          if [ -n "$problems" ]; then
            echo "::error::Room schema changed but is not committed:"
            for f in $problems; do echo "===== $f"; cat "$f"; echo; done
            exit 1
          fi
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Run lint
        run: ./gradlew --stacktrace lintDebug
      - name: Print lint findings
        if: always()
        run: find app/build -name 'lint-results-debug.txt' -exec cat {} \; || true
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  assemble-debug:
    name: Debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Assemble debug APK
        # The Maps key is optional; without the secret the APK shows a "map unavailable" view.
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: ./gradlew --stacktrace assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: parkv3-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
